
[env]
LANG = "en_US.UTF-8"
LC_ALL = "en_US.UTF-8"
TERM = "xterm-256color"

[window]
decorations = "None"
startup_mode = "Maximized"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font]
size = 13.0

[cursor.style]
blinking = "Always"
shape = "Beam"

[general]
live_config_reload = true

import = [
    "~/.config/alacritty/catppuccin-mocha.toml"
]

[terminal]

[cursor]
vi_mode_style = "Beam"

[terminal.shell]
args = ["--login"]
program = "/usr/bin/zsh"
